name: fork-review-runtime

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'plannotator-tui.version'
      - 'scripts/prepare-plannotator-tui.sh'
      - 'scripts/build-plannotator-tui.sh'
      - '.github/workflows/plannotator-tui-release.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'plannotator-tui.version'
      - 'scripts/prepare-plannotator-tui.sh'
      - 'scripts/build-plannotator-tui.sh'
      - '.github/workflows/plannotator-tui-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: bash scripts/prepare-plannotator-tui.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/plannotator-tui
      - run: cargo fmt --manifest-path .build/plannotator-tui/Cargo.toml --all --check
      - run: cargo clippy --manifest-path .build/plannotator-tui/Cargo.toml --locked --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path .build/plannotator-tui/Cargo.toml --locked --workspace

  build:
    needs: check
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: prepare pinned and patched source
        shell: bash
        run: bash scripts/prepare-plannotator-tui.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/plannotator-tui
          key: ${{ matrix.target }}
      - name: build and name asset
        shell: bash
        run: |
          cargo build --manifest-path .build/plannotator-tui/Cargo.toml --locked --release -p plannotator-tui --target '${{ matrix.target }}'
          mkdir -p dist
          suffix=''
          if [ '${{ runner.os }}' = 'Windows' ]; then suffix='.exe'; fi
          cp '.build/plannotator-tui/target/${{ matrix.target }}/release/plannotator-tui'"$suffix" 'dist/plannotator-tui-${{ matrix.target }}'"$suffix"
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tui-*
          path: dist
          merge-multiple: true
      - name: publish verified fork binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < plannotator-tui.version)
          (cd dist && sha256sum plannotator-tui-* > SHA256SUMS)
          tag="tui-v$version"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$tag" --notes 'Pinned plannotator-tui with explicit agent selection and cross-tab recipient labels.' dist/*
          fi
